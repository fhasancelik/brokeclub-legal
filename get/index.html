<script>
// Send phones straight to their own store; desktop keeps both buttons.
(function () {
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var target = isIOS ? document.getElementById("ios").href
             : isAndroid ? document.getElementById("android").href
             : null;
  // replace() so Back returns to Instagram, not to this interstitial
  if (target) setTimeout(function () { location.replace(target); }, 120);
})();
